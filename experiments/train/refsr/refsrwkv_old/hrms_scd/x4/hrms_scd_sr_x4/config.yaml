data:
  batch_size: 16
  val_batch_size: 8
  num_workers: 8
  val_num_workers: 4
  prefetch_factor: 4
  persistent_workers: true
  pin_memory: true
  drop_last: true
  max_samples_train: null
  max_samples_val: 300
  max_samples_test: null
  sample_seed: 42
  augment: true
  reference_mode: lr_up
  root: data/refsr/HRMS_SCD
  scale: 4
