    native_scale: 4
    provenance: bicubic
    source: auto
  source:
    image_size:
    - 512
    - 512
    channels: 3
    reference: cross-temporal T1 image
  prepared:
    hr_size:
    - 512
    - 512
    lr_size:
    - 128
    - 128
    ref_size:
    - 512
    - 512
    scale: 4
    splits:
      train: 19058
      val: 1058
      test_easy: 500
      test_hard: 500
  reference_policy: original cross-temporal reference image
run:
  name: hrms_scd_sr_x4
  scale: 4
  lr_patch: 48
