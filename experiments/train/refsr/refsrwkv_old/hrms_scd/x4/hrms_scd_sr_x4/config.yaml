train:
  accelerator: auto
  devices: 1
  precision: bf16-mixed
  max_epochs: -1
  max_steps: 120000
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 2
  log_every_n_steps: 50
  num_sanity_val_steps: 0
  grad_clip_norm: 1.0
  learning_rate: 0.0001
  weight_decay: 0.0
  adam_betas:
  - 0.9
  - 0.999
  lr_scheduler: plateau
  lr_patience: 3
  lr_factor: 0.5
  lr_threshold: 0.0001
  lr_min: 1.0e-06
  stop_at_lr_min: true
  use_ema: true
  ema_decay: 0.999
  save_top_k: 3
  early_stopping_patience: null
  auto_resume: true
  seed: 42
output:
  root: experiments
  train_root: experiments/train
  test_root: experiments/test
  experiment_name: hrms_scd_sr_x4
