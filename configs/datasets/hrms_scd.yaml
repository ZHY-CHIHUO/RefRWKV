# RefSR-HRMS / HRMS-SCD dataset metadata. Training choices belong in
# configs/runs/.
base: ../sr_prior_base.yaml

dataset:
  id: hrms_scd
  name: RefSR-HRMS (HRMS-SCD)
  kind: paired_reference
  root: RefSR_data/HRMS_SCD
  default_scale: 4
  source:
    image_size: [512, 512]
    channels: 3
    reference: cross-temporal T1 image
  prepared:
    hr_size: [512, 512]
    lr_size: [128, 128]
    ref_size: [512, 512]
    scale: 4
    splits: {train: 19058, val: 1058, test_easy: 500, test_hard: 500}
  reference_policy: original cross-temporal reference image
