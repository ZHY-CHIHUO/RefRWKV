# UC Merced Land Use dataset metadata. Training choices belong in configs/runs/.
base: ../sr_prior_base.yaml

dataset:
  id: ucmerced
  name: UC Merced Land Use
  kind: synthetic_sisr
  root: SR_data/remote_sensing/prepared/UC_Merced
  default_scale: 4
  source:
    image_size: [256, 256]
    channels: 3
    classes: 21
    images: 2100
  prepared:
    hr_size: [256, 256]
    lr_size: [64, 64]
    scale: 4
    splits: {train: 1470, val: 315, test: 315}
  reference_policy: none on disk; RefSRWKV lr_up derives bicubic LR at runtime
