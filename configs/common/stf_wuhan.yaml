# Shared Wuhan STF contract: 4-band, [0, 1], aligned 1000x1000 grid.
#
# Official STFMamba train.py (https://github.com/zhaomin0101/STFMamba):
#   Adam 5e-4, CosineAnnealingLR(T_max=200, eta_min=1e-5) stepped once per
#   epoch, batch 10, patch 128, 200 epochs, seed 2021, num_workers 4,
#   PatchSet.total_index=12000 (1200 steps/epoch), Charbonnier(eps=1e-3)
#   + (1 - MS-SSIM).
# Their LGC/DX npy is mapped to [-1, 1] (val_range=2).  Wuhan here is
# /11848 -> [0, 1], so the structure term is gaussian SSIM with L=1.
# Auxiliary VGG (1e-3) is omitted: 4-band Wuhan is not ImageNet RGB.
# Train draws 12000 random 128 crops from the 8 TIFF pairs so the epoch
# size matches the official npy PatchSet.  Val/test stay on real pairs;
# test_patch_size is null (full 1000x1000).
base:
  - refsr_paired.yaml

data:
  reference_mode: paired
  patch_size: 128
  val_patch_size: 128
  test_patch_size: null
  num_patches: 12000
  val_num_patches: null
  test_num_patches: null
  batch_size: 10
  val_batch_size: 2
  num_workers: 4
  val_num_workers: 2
  persistent_workers: false
  pin_memory: true
  drop_last: true
  augment: true
  lr_source: stored
  lr_provenance: sensor
  lr_native_scale: 1
  value_scale: 11848.0
  physical_resolution_ratio: 3.75
  target_time: t2
  reference_time: t1
  return_quadruple: true
  c0_key: lr_t1
  use_c0: true
  cache: true
  eval_tile_size: 128
  eval_tile_overlap: 16

train:
  precision: "32"
  max_epochs: 200
  max_steps: -1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  optimizer: adam
  learning_rate: 0.0005
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  lr_scheduler: cosine
  lr_interval: epoch
  lr_t_max: 200
  lr_min: 0.00001
  grad_clip_norm: 1.0
  use_ema: false
  save_top_k: 3
  early_stopping_patience: null
  seed: 2021
  num_sanity_val_steps: 0

loss:
  name: charbonnier
  eps: 0.001
  ssim_weight: 1.0
  fft_weight: 0.0

test:
  splits: [test]
  metrics: [psnr, ssim, rmse, uiqi, psnr_wuhan, sam_deg, ergas]
  save_images: false
  batch_size: 1
