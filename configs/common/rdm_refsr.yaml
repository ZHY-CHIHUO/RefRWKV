# Common optimizer/data settings for the RDMRefSR hybrid architecture.
base:
  - refsr.yaml

data:
  augment: true
  batch_size: 8
  val_batch_size: 4
  num_workers: 8
  val_num_workers: 4
  pin_memory: true

train:
  precision: bf16-mixed
  max_epochs: -1
  max_steps: 100000
  accumulate_grad_batches: 2
  learning_rate: 0.0002
  weight_decay: 0.00001
  lr_scheduler: cosine
  lr_min: 0.000001
  grad_clip_norm: 1.0
  use_ema: true
  ema_decay: 0.999

loss:
  name: charbonnier
  eps: 0.001
  sam_weight: 0.05
  wavelet_weight: 0.15
  consistency_weight: 0.05
  sensor_weight: 0.10
  change_weight: 0.05
  ref_drop_prob: 0.10
