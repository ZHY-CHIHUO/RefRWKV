# Physical-reference settings shared by RefSR models that consume
# ``<split>/Ref`` alongside LR and HR. Do not inherit this profile for an
# HR/LR-only SISR dataset using ``reference_mode: lr_up``.
base: refsr.yaml

data:
  reference_mode: paired
  augment_ref: false
  ref_aug_strengths: [0.12, 0.12, 0.12, 0.03]
  ref_aug_probs: [0.5, 0.5, 0.5, 0.5]
  ref_gray_prob: 0.2
