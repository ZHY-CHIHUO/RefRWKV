# Fixed protocol for HRMS-SCD x4 comparison runs.  Include this file last in
# a run's ``base`` list so model-family defaults cannot silently alter the
# optimizer, validation cadence or reconstruction objective.

train:
  learning_rate: 1.0e-4
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  lr_scheduler: plateau
  lr_patience: 3
  lr_factor: 0.5
  lr_threshold: 1.0e-5
  lr_min: 1.0e-7
  max_epochs: -1
  max_steps: 50000
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 2
  grad_clip_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  early_stopping_patience: null

loss:
  name: l1
  # Keep auxiliary reconstruction terms explicit so every benchmark config
  # represents the same L1-only objective, including direct RefSR baselines.
  ssim_weight: 0.0
  fft_weight: 0.0
