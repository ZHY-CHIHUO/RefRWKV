base: refsr_paired.yaml

task: refsr

data:
  reference_mode: paired
  patch_size: 480
  augment: true
  augment_ref: true
  ref_aug_strengths: [0.15, 0.15, 0.15, 0.03]
  ref_aug_probs: [0.5, 0.5, 0.5, 0.5]
  ref_gray_prob: 0.3
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  val_num_workers: 2

train:
  precision: "32"
  max_epochs: 100
  max_steps: -1
  val_check_interval: 0.1
  log_every_n_steps: 20
  early_stopping_patience: 50
  save_top_k: 3
  resume_ckpt: null
  learning_rate: 0.00001
  weight_decay: 0.001
  lr_D: 0.000005
  lr_D_texture: 0.000001
  d_weight_decay: 0.001
  d_betas: [0.5, 0.999]
  use_amp: false

model:
  name: RefDiffRWKV
  strategy: rwkv
  sd_model_path: sd2-community/stable-diffusion-2-1-base
  use_lora: true
  lora_rank: 64
  lora_target_modules: [to_k, to_q, to_v, to_out.0]
  sd_locked: true
  use_semantic: false
  dinov2_model_name: facebook/dinov2-base
  use_sr_condition: false
  wkv_backend: torch
  use_reference: true
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: scaled_linear
  prediction_type: epsilon
  t_min: 300
  t_max: 700
  train_t_min: 0
  train_t_max: 999
  aux_t_min: 100
  aux_t_max: 400
  cfg_drop_prob: 0.2
  control_scale: 1.0
  sr_enabled: true
  sr_fixed: true
  sr_lr: 0.00001
  sr:
    # Registered direct RefSR model used as the diffusion condition branch.
    name: refsrwkv
    inp_channels: 3
    out_channels: 3
    dim: 48
    num_blocks: [4, 6, 6, 8]
    num_refinement_blocks: 4
    upsampler: direct
    color_match: global
    drop_path_rate: 0.1
    hidden_rate: 4
    ckpt_path: null
  use_sr_latent_cond: true
  use_discriminator: false
  gan_enabled: false
  sample_steps: 20
  fr_metrics: [psnr, ssim]
  t_start: 300
  guidance_scale: 0.0
  t_stop: 200

loss:
  lambda_diff_sr: 0.5
  lambda_lpips: 0.0
  lambda_gan: 0.0
  lambda_gan_texture: 0.0
  lambda_sr_noise: 1.0
  sr_noise_warmdown_start: 1.0
  sr_noise_warmdown_steps: 0
