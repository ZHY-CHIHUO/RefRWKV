# ============================================================
# Stage 2 — 语义路径重训（DINOv2 冻结 + RWKV 金字塔随机初始化）+ SR 条件分支
# 恢复：从 Stage1 的 last.ckpt 跨阶段恢复（新增语义参数随机初始化）
# ============================================================
base: base.yaml

model:
  use_semantic: true             # 金字塔随机初始化重训
  use_sr_condition: true         # SR latent 条件分支
  lambda_sr_noise: 1.0           # HR/SR 等权
  use_amp: true
  sr:
    ckpt_path: null              # 走 resume_ckpt 兜底加载 SR 权重

train:
  precision: "bf16-mixed"
  resume_ckpt: "checkpoints/sd2_ref_gan_Stage1/last.ckpt"
  best_save:
    metrics: ["psnr", "ssim"]
    min_improved: 2

output:
  experiment_name: "sd2_ref_gan_Stage2"
