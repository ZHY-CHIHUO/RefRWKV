# ============================================================
# Stage 1 — 纯扩散基线：LR/HR + SR latent 条件，无语义/无纹理/无 GAN
# 恢复：无（从头训练）；SR Prior 从 sr.ckpt_path 加载并冻结
# ============================================================
base: base.yaml

model:
  lambda_sr_noise: 0.5          # Stage1: SR 路径半权
  use_amp: true                 # bf16 混合精度（RTX 5060 Ti/Blackwell 原生支持）

train:
  precision: "bf16-mixed"       # bf16 加速；SR prior 内部仍强制 fp32
  resume_ckpt: null
  best_save:
    metrics: ["psnr", "ssim"]
    min_improved: 2

output:
  experiment_name: "sd2_ref_gan_Stage1"
