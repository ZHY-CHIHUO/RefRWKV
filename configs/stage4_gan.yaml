# ============================================================
# Stage 4 — GAN 精调：全量 loss + Swap Test + D_tex 置信加权
# 恢复：从 Stage3 的 last.ckpt 跨阶段恢复（判别器随机初始化，属预期）
# ============================================================
base: base.yaml

model:
  use_semantic: true             # 语义路径保持开启（base 默认关闭）
  use_sr_condition: true
  rwkv_cfg:
    use_self_sim_transfer: true
    self_sim_topk: 8
    self_sim_init_alpha: 0.3
  use_confidence_gate: true
  use_temporal_gate: true
  use_discriminator: true
  gan_enabled: true
  dtex_conf_weight: true         # D_tex 只在可信区执法
  use_swap_test: true
  swap_ratio: 0.5
  learning_rate: 0.000001        # 1e-6
  lr_D: 0.000001
  lr_D_texture: 0.0000005
  lambda_diff_sr: 0.3
  lambda_lpips: 0.5
  lambda_gan: 0.02
  lambda_gan_texture: 0.05
  lambda_sr_noise: 0.0
  use_amp: false

train:
  precision: "32"
  resume_ckpt: "checkpoints/sd2_ref_gan_Stage3/last.ckpt"
  best_save:
    metrics: ["psnr", "ssim", "lpips"]
    min_improved: 2

output:
  experiment_name: "sd2_ref_gan_Stage4"
