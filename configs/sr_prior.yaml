# ============================================================
# RefSRWKV SR Prior 训练配置（8 方向 + OmniShift 空洞卷积版）
# ============================================================

model:
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 8
  scale: 10
  drop_path_rate: 0.1
  hidden_rate: 4
  learning_rate: 2.0e-4
  warmup_steps: 500

data:
  root: "/home/zhy/PROJECT/RefRWKV/RefSR_data/ALL_2"
  patch_size: 480
  scale: 10
  augment: true
  augment_ref: true
  ref_aug_strengths: [0.12, 0.12, 0.12, 0.03]
  ref_aug_probs: [0.5, 0.5, 0.5, 0.5]
  ref_gray_prob: 0.2
  batch_size: 6
  val_batch_size: 1
  num_workers: 8
  val_num_workers: 2
  prefetch_factor: 6

train:
  devices: 1
  precision: "32"
  max_epochs: 200
  val_check_interval: 0.2
  log_every_n_steps: 20
  early_stopping_patience: 30
  save_top_k: 3
  grad_clip_val: 1.0
  seed: 42

output:
  checkpoint_dir: "checkpoints/refrwkv_sr_v2"
  log_dir: "logs/refrwkv_sr_v2"
  experiment_name: "refrwkv_sr_v2"