# ============================================================
# base.yaml — 公共默认配置（四阶段与消融实验共用基底）
# 阶段/消融配置通过 base: 字段引用本文件并只写差异字段。
# 所有功能开关默认关闭，loss 系数默认 0 —— 消融实验从零开始逐项开启。
# ============================================================

pretrained:
  sd2_control_ckpt: null

model:
  # ── 数据键 ──
  lr_key: "lr"
  ref_key: "ref"
  hr_key: "hr"

  # ── 参考融合 Adapter ──
  strategy: "rwkv"                      # lca / dual / cat / rwkv
  rwkv_cfg:
    patch_size: 4
    embed_dim: 192
    in_channels: 3
    upsample_mode: "bilinear"
    use_self_sim_transfer: false
    self_sim_topk: 8
    self_sim_init_alpha: 0.3

  # ── SD2 ──
  sd_model_path: "sd2-community/stable-diffusion-2-1-base"
  use_lora: true
  lora_rank: 64
  lora_target_modules: [to_k, to_q, to_v, to_out.0]
  sd_locked: true

  # ── 语义路径（DINOv2 冻结 + RWKV 金字塔） ──
  use_semantic: false
  dinov2_model_name: "facebook/dinov2-base"
  use_sr_condition: false
  wkv_backend: "torch"                  # torch（默认）| cuda（需数值对齐验证）

  # ── 参考图 ──
  use_reference: true                   # false = 无参考消融（LR 上采样作中性自参考）

  # ── 扩散调度 ──
  num_train_timesteps: 1000
  beta_start: 0.00085
  beta_end: 0.012
  beta_schedule: "scaled_linear"
  prediction_type: "epsilon"
  t_min: 300
  t_max: 700
  train_t_min: 0
  train_t_max: 999
  aux_t_min: 100
  aux_t_max: 400
  cfg_drop_prob: 0.2
  control_scale: 1.0

  # ── SR Prior（冻结） ──
  use_sr_latent_cond: true
  sr_enabled: true
  sr_fixed: true
  sr_lr: 1.0e-5
  sr:
    inp_channels: 3
    out_channels: 3
    dim: 48
    num_blocks: [4, 6, 6, 8]
    num_refinement_blocks: 4
    scale: 10
    upsampler: direct
    color_match: global
    windows:
      phase_mode: local
      enc1: {size: 8, offsets: [0, 4]}
      enc2: {size: 8, offsets: [0, 4]}
      enc3: {size: 4, offsets: [0, 2]}
      latent: {size: 3, offsets: [0, 1]}
      dec3: {size: 4, offsets: [0, 2]}
      dec2: {size: 8, offsets: [0, 4]}
      dec1: {size: 8, offsets: [0, 4]}
      refine: {size: 8, offsets: [0, 4]}
    drop_path_rate: 0.1
    hidden_rate: 4
    # Set this to the SR checkpoint produced by the current SR training run.
    # Keeping it null prevents an obsolete local checkpoint from being used
    # accidentally when starting a diffusion stage.
    ckpt_path: null

  # ── 门控 ──
  use_confidence_gate: false
  confidence_alpha: 0.4
  use_temporal_gate: false
  control_scale_min: 0.3
  control_scale_max: 1.5

  # ── GAN / 判别器 ──
  use_discriminator: false
  gan_enabled: false
  use_semantic_d: true
  use_texture_d: true
  semantic_alpha: 0.8
  semantic_use_freq: true
  semantic_trainable_stages: 1
  semantic_precision: "fp32"
  texture_base_ch: 48
  texture_num_scales: 4
  texture_use_spectral: true
  use_swap_test: false
  swap_ratio: 0.5
  dtex_conf_weight: false

  # ── 优化 ──
  learning_rate: 0.00001
  weight_decay: 0.001
  lr_D: 0.000001
  lr_D_texture: 0.0000005
  d_weight_decay: 0.001
  d_betas: [0.5, 0.999]
  use_amp: false
  accumulate_grad_batches: 8
  g_d_ratio: 1
  max_consecutive_nan: 20
  grad_clip_val: 1.0
  grad_warn_threshold: 100.0

  # ── Loss 系数（0 = 关闭） ──
  lambda_diff_sr: 0.0
  lambda_lpips: 0.0
  lambda_gan: 0.0
  lambda_gan_texture: 0.0
  lambda_sr_noise: 1.0
  sr_noise_warmdown_start: 1.0
  sr_noise_warmdown_steps: 0

  # ── 采样 / 评估 ──
  gan_crop_size: 256
  gan_warmup_steps: 3000
  sample_steps: 20
  fr_metrics: [psnr, ssim, lpips]
  t_start: 300
  guidance_scale: 0.0
  t_stop: 200

data:
  root: "RefSR_data/ALL_2"
  patch_size: 480
  scale: 10
  augment: true
  augment_ref: true
  ref_aug_strengths: [0.15, 0.15, 0.15, 0.03]
  ref_aug_probs: [0.5, 0.5, 0.5, 0.5]
  ref_gray_prob: 0.3
  batch_size: 1
  val_batch_size: 1
  num_workers: 4
  val_num_workers: 2
  prefetch_factor: 2

train:
  devices: 1
  precision: "32"
  max_epochs: 100
  val_check_interval: 0.1
  log_every_n_steps: 20
  early_stopping_patience: 50
  save_top_k: 3
  detect_anomaly: false
  seed: 42
  resume_ckpt: null
  # ── 监控指标配置（权重保存 / EarlyStopping 都以 loss 为准）──
  # 默认 val/loss_diff (min)：loss 单调下降 → top-k 持续落盘，不会零落盘。
  # 可用替代：val_psnr (max) / val/lpips (min) / val/ssim (max)
  ckpt_monitor: "val/loss_diff"
  ckpt_mode: "min"
  ckpt_filename: "{epoch:04d}-{step:06d}-{monitor:.4f}"   # {monitor} 自动替换
  es_monitor: null                 # null = 跟随 ckpt_monitor
  es_mode: null                    # null = 跟随 ckpt_mode
  # 附加权重监控器（任意多个，每个生成一个 ModelCheckpoint）
  # 每项: monitor / mode(min|max) / save_top_k / filename(可选, 支持 {monitor})
  # 例: 额外按 LPIPS 保存 top1
  #   extra_checkpoints:
  #     - monitor: "val/lpips"
  #       mode: "min"
  #       save_top_k: 1
  extra_checkpoints: []
  best_save:
    metrics: ["psnr", "ssim"]
    min_improved: 2

output:
  checkpoint_dir: "checkpoints"
  log_dir: "logs/sd2_ref_gan"
  experiment_name: "sd2_ref_gan"
