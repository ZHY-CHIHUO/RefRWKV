# Common protocol for all HR/LR single-image SR baselines.  Dataset facts live
# in configs/datasets/, architecture choices live in models/, and each run
# only contains its dataset/scale-specific differences.

loss:
  name: l1

data:
  augment: true
  batch_size: 16
  val_batch_size: 2
  num_workers: 8
  val_num_workers: 2
  prefetch_factor: 4
  pin_memory: true
  persistent_workers: true
  drop_last: true
  max_samples_train: null
  max_samples_val: null
  max_samples_test: null

train:
  accelerator: gpu
  devices: 1
  precision: bf16-mixed
  max_epochs: -1
  max_steps: 50000
  learning_rate: 1.0e-4
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  lr_scheduler: plateau
  lr_patience: 3
  lr_factor: 0.5
  lr_min: 1.0e-7
  lr_threshold: 1.0e-5
  grad_clip_norm: 1.0
  use_ema: true
  ema_decay: 0.999
  accumulate_grad_batches: 2
  val_check_interval: 1.0
  check_val_every_n_epoch: 10
  log_every_n_steps: 50
  save_top_k: 3
  early_stopping_patience: null
  num_sanity_val_steps: 0
  seed: 42
  auto_resume: true

output:
  checkpoint_root: checkpoints/baselines
  log_root: logs/baselines
  experiment_prefix: baseline
