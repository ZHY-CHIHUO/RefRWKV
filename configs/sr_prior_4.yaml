# ============================================================
# RefSRWKV SR Prior ×4 训练配置 — RefSR-HRMS
# 由 ×10 配置迁移：scale 10→4、数据切换到 HRMS_SCD、
# 全图训练、关闭 Ref 人工增强、输出目录隔离
# ============================================================

model:
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  scale: 4                     # ×4（原 ×10）
  drop_path_rate: 0.1
  hidden_rate: 4
  # ── 优化器 ──
  learning_rate: 5.0e-5        # 等效 batch 仍为 8，学习率不变
  warmup_steps: 100
  # ── 梯度 / EMA ──
  grad_clip_norm: 1.0
  ema_decay: 0.999
  use_ema: true

data:
  root: "RefSR_data/HRMS_SCD"  # ← 切换到 RefSR-HRMS（原 ALL_2）
  patch_size: null             # 全图 512×512 训练（原 480 裁块）
  scale: 4
  augment: true                # flip + rot90，HR/LR/Ref 同步
  augment_ref: false           # 跨时相天然域差已足够，不再人工增强
  ref_gray_prob: 0.2           # 保留真实参考信号
  batch_size: 4                # 全图单卡友好
  val_batch_size: 1
  num_workers: 8
  val_num_workers: 2
  prefetch_factor: 4
  pin_memory: true
  max_samples_val: 300         # 固定 300 张低变化样本做验证（seed=42 可复现）

train:
  devices: 1
  precision: "bf16-mixed"
  max_epochs: 200
  val_check_interval: 0.25      # 全图每 epoch 约 1.9 万步，半 epoch 验一次
  log_every_n_steps: 20
  early_stopping_patience: 20  # 每 0.5 epoch 验一次 → 约 10 个 epoch 无提升才停
  save_top_k: 3
  # ── 梯度裁剪（Trainer 统一入口）──
  grad_clip_val: 1.0
  grad_clip_algorithm: norm    # "norm" 或 "value"
  seed: 42
  accumulate_grad_batches: 2

output:
  checkpoint_dir: "checkpoints/refrwkv_sr_4"   # 与 ×10 隔离，防误续训
  log_dir: "logs/refrwkv_sr"
  experiment_name: "refrwkv_sr_4"
