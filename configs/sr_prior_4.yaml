model:
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  scale: 4
  drop_path_rate: 0.1
  hidden_rate: 4
  learning_rate: 1.0e-4
  warmup_steps: 2000
  grad_clip_norm: 1.0
  ema_decay: 0.999
  use_ema: true
  ssim_weight: 0.0
  fft_weight: 0.2
  ref_drop_prob: 0.5

data:
  root: "RefSR_data/HRMS_SCD"
  patch_size: 128
  scale: 4
  augment: true
  augment_ref: false
  ref_gray_prob: 0.0
  batch_size: 16
  val_batch_size: 1
  num_workers: 8
  val_num_workers: 2
  prefetch_factor: 4
  pin_memory: true
  max_samples_val: 300

train:
  devices: 1
  precision: bf16-mixed
  max_epochs: 80
  val_check_interval: 0.5
  accumulate_grad_batches: 1
  save_top_k: 3
  early_stopping_patience: 80

output:
  checkpoint_dir: checkpoints/refrwkv_sr_4
  log_dir: logs/refrwkv_sr_4
  experiment_name: refwkv_sr_4
