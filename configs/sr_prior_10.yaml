# ============================================================
# RefSRWKV SR Prior 训练配置
# （EMA + 梯度裁剪 + 验证指标驱动的学习率衰减）
# ============================================================

model:
  inp_channels: 3
  out_channels: 3
  dim: 48
  num_blocks: [4, 6, 6, 8]
  num_refinement_blocks: 4
  scale: 10
  drop_path_rate: 0.1
  hidden_rate: 4
  # ── 优化器 ──
  learning_rate: 5.0e-5
  lr_scheduler: plateau
  lr_patience: 1 # 容忍 1 个无改善 epoch，第 2 个触发衰减
  lr_factor: 0.5
  lr_min: 1.0e-6
  # ── 梯度 / EMA ──
  grad_clip_norm: 1.0        # LitRefSRWKV 内部的 fallback 值
  ema_decay: 0.999            # EMA 衰减率
  use_ema: true               # 是否启用 EMA

data:
  root: "RefSR_data/ALL_2"
  patch_size: 480
  scale: 10
  augment: true
  augment_ref: true
  ref_aug_strengths: [0.12, 0.12, 0.12, 0.03]
  ref_aug_probs: [0.5, 0.5, 0.5, 0.5]
  ref_gray_prob: 0.2
  batch_size: 4
  val_batch_size: 1
  num_workers: 8
  val_num_workers: 2
  prefetch_factor: 4

train:
  devices: 1
  precision: "bf16-mixed"
  max_epochs: 200
  val_check_interval: 0.1
  log_every_n_steps: 20
  early_stopping_patience: 30
  save_top_k: 3
  # ── 梯度裁剪（Trainer 统一入口）──
  grad_clip_val: 1.0
  grad_clip_algorithm: norm   # "norm" 或 "value"
  seed: 42
  accumulate_grad_batches: 2

output:
  checkpoint_dir: "checkpoints/refrwkv_sr_10"
  log_dir: "logs/refrwkv_sr"
  experiment_name: "refrwkv_sr_10"
