# ============================================================
# 消融 B：RWKV(SR prior) + SD2 扩散先验，无参考图（use_reference=false）
# 对照：消融 C 用 stage1_baseline.yaml（参考开）→ 差值 = 参考图贡献
# 说明：从零训练（与 C 同预算），语义/GAN 均关闭（base 默认）
# ============================================================
base: ../base.yaml

model:
  use_reference: false           # LR 上采样作中性自参考，adapter 退化为单图特征
  lambda_sr_noise: 0.5
  use_amp: false

train:
  precision: "32"
  resume_ckpt: null

output:
  experiment_name: "ablation_b_sd2_noref"
