# RDM-STF: same-band (C0, F0, C1) -> F1 on the rdm_pan dual-stream skeleton.
# Wuhan is 4-band scale=1; HRMS overrides channels and scale.
model:
  name: rdm_stf
  family: rdm
  variant: rdm_stf
  implementation: hr_dual_stream_rwkv_mamba_stf
  inp_channels: 4
  out_channels: 4
  ref_channels: 4
  dim: 32
  reference_kind: stf
  mamba_d_state: 8
  mamba_d_conv: 4
  mamba_expand: 1
  allow_cpu_mamba: true
  use_reference: true
  clamp_output: true
