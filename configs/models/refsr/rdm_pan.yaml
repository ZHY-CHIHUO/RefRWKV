# RDM-PAN: dedicated MS LR + PAN HR pansharpening network.
# FusionMamba-style dual stream on the HR grid, residual on bicubic MS.
# No matcher, reliability, or change gating.
model:
  name: rdm_pan
  family: rdm
  variant: rdm_pan
  implementation: hr_dual_stream_rwkv_mamba
  inp_channels: 8
  out_channels: 8
  ref_channels: 1
  target_channels: 8
  dim: 32
  reference_kind: pan
  mamba_d_state: 8
  mamba_d_conv: 4
  mamba_expand: 1
  allow_cpu_mamba: true
  use_reference: true
  clamp_output: true
