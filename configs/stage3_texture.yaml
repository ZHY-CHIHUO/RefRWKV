# ============================================================
# Stage 3 — 纹理迁移完整链路（无 GAN）：
#   SelfSimTransfer + 置信门控 + 时序门控 + 像素(diff_sr)/感知(LPIPS)
# 恢复：从 Stage2 的 last.ckpt 跨阶段恢复（sim_transfer* 随机初始化，属预期）
# ============================================================
base: base.yaml

model:
  use_semantic: true             # 语义路径保持开启（base 默认关闭）
  use_sr_condition: true
  rwkv_cfg:
    use_self_sim_transfer: true
    self_sim_topk: 8
    self_sim_init_alpha: 0.3
  use_confidence_gate: true
  confidence_alpha: 0.4
  use_temporal_gate: true
  control_scale_min: 0.3
  control_scale_max: 1.5
  learning_rate: 0.000005        # 5e-6
  lambda_diff_sr: 0.3
  lambda_lpips: 0.5
  lambda_sr_noise: 0.0           # 关闭 SR epsilon，改走 pred_x0
  sr_noise_warmdown_start: 1.0   # 从 Stage2 的 SR epsilon 权重平滑衔接
  sr_noise_warmdown_steps: 5000
  use_amp: true

train:
  precision: "bf16-mixed"
  early_stopping_patience: 20
  resume_ckpt: "checkpoints/sd2_ref_gan_Stage2/last.ckpt"
  # 主权重监控默认 val/loss_diff (min，base.yaml)；Stage 3 主线是感知质量，
  # 额外按 LPIPS 保存 top1，EarlyStopping 也以 LPIPS 为准
  es_monitor: "val/lpips"
  es_mode: "min"
  extra_checkpoints:
    - monitor: "val/lpips"
      mode: "min"
      save_top_k: 1
  best_save:
    metrics: ["psnr", "ssim", "lpips"]
    min_improved: 2

output:
  experiment_name: "sd2_ref_gan_Stage3"
