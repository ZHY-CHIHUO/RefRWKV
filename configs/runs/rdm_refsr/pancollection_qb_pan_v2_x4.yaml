# Dedicated PAN RDM v2 on reduced-resolution QuickBird.
# Same recipe as WV3 v2, but 4-band MS instead of 8-band.
# Includes:
# - High-pass PAN input (removes DC bias)
# - Adaptive final dual-stream softmax mix
# - Spatial-conditioned SpectralGate
# - Light spatial (shuffle_prob=0.05) & spectral drop (1 band) regularization
# - Consistency loss (0.1) & pan structure loss (0.02)
# - BS=64, max_epochs=800, augment=true
base:
  - ../../common/rdm_pan.yaml
  - ../../models/refsr/rdm_pan.yaml

dataset:
  config: ../../datasets/refsr/pancollection_qb.yaml

task: refsr
run:
  name: pancollection_qb_rdm_pan_v2_x4
  scale: 4
  lr_patch: 16

model:
  inp_channels: 4
  out_channels: 4
  ref_channels: 1
  target_channels: 4

data:
  root: data/refsr/PanCollection/training_qb
  reference_mode: paired
  lr_source: stored
  lr_native_scale: 4
  lr_provenance: sensor
  value_scale: 2047.0
  patch_size: 64
  test_patch_size: null
  eval_tile_size: 16
  eval_tile_overlap: 8
  batch_size: 64
  val_batch_size: 64
  max_samples_val: null

test:
  splits: [test]
  metrics: [psnr, ssim]
  save_images: false
