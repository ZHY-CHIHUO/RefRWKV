# Template for LR-HSI + HR-MSI fusion. Replace dataset.config with the local
# loader/configuration for the selected HSI-MSI benchmark.
base:
  - ../../common/rdm_refsr.yaml
  - ../../models/refsr/rdm_refsr.yaml

task: refsr
run:
  name: hsi_msi_rdm_refsr_x4
  scale: 4
  lr_patch: 32

data:
  reference_mode: paired

model:
  inp_channels: 31
  ref_channels: 4
  out_channels: 31
  target_channels: 31
  reference_kind: hsi_msi
  alignment: true
  # Replace with the sensor's 31x4 spectral response when available.  The
  # uniform fallback keeps the example runnable but is not a calibrated SRF.
  response_matrix: null
