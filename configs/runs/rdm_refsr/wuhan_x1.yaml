# RDM-STF on Wuhan with the official STFMamba training recipe.
base:
  - ../../common/stf_wuhan.yaml
  - ../../models/refsr/rdm_stf.yaml

dataset:
  config: ../../datasets/refsr/wuhan.yaml

task: refsr

run:
  name: rdm_stf_wuhan
  scale: 1

model:
  inp_channels: 4
  out_channels: 4
  ref_channels: 4
  dim: 32
