# RDM-STF on Wuhan with the same 4-band quadruple contract as STFMamba.
base:
  - ../../common/stf_wuhan.yaml
  - ../../models/refsr/rdm_stf.yaml

dataset:
  config: ../../datasets/refsr/wuhan.yaml

task: refsr

run:
  name: rdm_stf_wuhan
  scale: 1

data:
  batch_size: 8
  val_batch_size: 4

model:
  inp_channels: 4
  out_channels: 4
  ref_channels: 4
  dim: 32

train:
  precision: "32"
  max_epochs: 200
  max_steps: -1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  learning_rate: 0.0005
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  lr_scheduler: cosine
  lr_min: 0.00001
  grad_clip_norm: 1.0
  use_ema: false
  save_top_k: 3
  early_stopping_patience: null
  seed: 1
  num_sanity_val_steps: 1

loss:
  name: charbonnier
  eps: 0.001
  ssim_weight: 1.0
  fft_weight: 0.0
