# STFMamba on Wuhan, 4-band [0, 1] quadruple (C0, F0, C1) -> F1.
# Optimizer/epochs/loss follow official train.py; batch 2 is a memory
# override (official batch is 10, model is ~20M vs rdm_stf 0.63M).
base:
  - ../../common/stf_wuhan.yaml
  - ../../models/refsr/stf_mamba.yaml

dataset:
  config: ../../datasets/refsr/wuhan.yaml

task: refsr

run:
  name: stf_mamba_wuhan
  scale: 1

data:
  batch_size: 2
  val_batch_size: 1

model:
  inp_channels: 4
  out_channels: 4
  ref_channels: 4
  in_chans: 4
