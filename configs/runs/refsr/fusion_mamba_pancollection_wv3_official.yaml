# FusionMamba WV3 training protocol aligned with the official repository.
# Official input is one 64x64 HR crop (8x16x16 MS + 1x64x64 PAN).
base:
  - ../../common/refsr_paired.yaml
  - ../../models/refsr/fusion_mamba.yaml

dataset:
  config: ../../datasets/refsr/pancollection_wv3.yaml

task: refsr

run:
  name: fusion_mamba_pancollection_wv3_official
  scale: 4
  lr_patch: 16

data:
  root: data/refsr/PanCollection/training_wv3
  reference_mode: paired
  lr_source: stored
  lr_native_scale: 4
  lr_provenance: sensor
  value_scale: 2047.0
  patch_size: 64
  batch_size: 32
  val_batch_size: 32
  num_workers: 0
  val_num_workers: 0
  augment: false
  augment_ref: false

model:
  input_h: 64
  input_w: 64
  dim: 32
  pan_dim: 1
  ms_dim: 8
  scale: 4

train:
  precision: "32"
  max_epochs: 500
  max_steps: -1
  val_check_interval: 1.0
  check_val_every_n_epoch: 10
  accumulate_grad_batches: 1
  learning_rate: 0.0005
  weight_decay: 0.0
  adam_betas: [0.9, 0.999]
  lr_scheduler: step
  lr_step_size: 200
  lr_gamma: 0.5
  grad_clip_norm: null
  use_ema: false
  save_top_k: 3
  early_stopping_patience: null
  seed: 1

loss:
  name: l1
  ssim_weight: 0.0
  fft_weight: 0.0

test:
  splits: [test]
  metrics: [psnr, ssim]
  save_images: false
