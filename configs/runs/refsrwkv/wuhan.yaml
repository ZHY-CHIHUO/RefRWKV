base:
  - ../../common/refsrwkv.yaml
  - ../../models/refsr/refsrwkv.yaml
  - ../../common/benchmark.yaml

task: refsr

dataset:
  config: ../../datasets/refsr/wuhan.yaml

run:
  name: wuhan
  # The TIFFs already share the HR grid; use x1 in the network.
  scale: 1

data:
  reference_mode: paired
  patch_size: 128
  val_patch_size: null
  batch_size: 1
  val_batch_size: 1
  num_workers: 0
  val_num_workers: 0
  persistent_workers: false
  prefetch_factor: 2
  pin_memory: true
  drop_last: false
  augment: true
  lr_source: stored
  lr_provenance: sensor
  lr_native_scale: 1
  value_scale: 11848.0
  physical_resolution_ratio: 3.75
  target_time: t2
  reference_time: t1
  return_quadruple: true
  cache: true
  # Full 1000×1000 grids are stitched from aligned tiles during validation
  # and test, avoiding the local-matching unfold peak of full-grid inference.
  eval_tile_size: 128
  eval_tile_overlap: 16

model:
  # Wuhan contains RGB+NIR (four bands), unlike the 3-band HRMS-SCD profile.
  inp_channels: 4
  out_channels: 4
  ref_channels: 4
  upsampler: direct
  dim: 64

train:
  # Small dataset: keep the run resumable and validate every epoch.
  max_epochs: 200
  max_steps: -1
  val_check_interval: 1.0
  check_val_every_n_epoch: 1
  accumulate_grad_batches: 1
  num_sanity_val_steps: 1
  # When --load-weights points to a 3-band HRMS-SCD checkpoint, copy RGB
  # input/reference boundary weights and initialize the fourth band by their
  # mean. Scale-dependent reconstruction/reference/fusion heads are
  # intentionally reinitialized.
  channel_adaptation: rgb_mean
