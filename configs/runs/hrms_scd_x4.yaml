# RefSR-HRMS x4 paired-reference fine-tuning. Initialize from the completed
# AID x4 checkpoint with --load_weights; do not resume its optimizer state.
base: ../datasets/hrms_scd.yaml

run:
  name: hrms_scd_x4
  scale: 4
  hr_patch: 512

data:
  reference_mode: paired
  max_samples_val: 300

model:
  learning_rate: 2.5e-5
  ref_drop_prob: 0.2

train:
  max_epochs: -1
  max_steps: 50000
