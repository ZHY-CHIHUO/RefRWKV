# AID x4 SISR from scratch. The model trains on native LR48/HR192 crops and
# validates on full LR128/HR512 images.
base: ../datasets/aid.yaml

run:
  name: aid_x4_l1
  scale: 4
  lr_patch: 48
  recipe: l1

model:
  ssim_weight: 0.0
  fft_weight: 0.0
  ref_drop_prob: 0.0

data:
  reference_mode: lr_up
  ref_gray_prob: 0.0
  batch_size: 16
  val_batch_size: 2
  max_samples_val: 300

train:
  max_epochs: -1
  max_steps: 50000
  val_check_interval: 1.0
  accumulate_grad_batches: 2
  log_every_n_steps: 50
  early_stopping_patience: null
