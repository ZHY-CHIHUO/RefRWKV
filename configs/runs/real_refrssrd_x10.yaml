# Real-RefRSSRD x10. Only values different from sr_prior_base.yaml are listed.
base: ../datasets/real_refrssrd.yaml

run:
  name: real_refrssrd_x10
  scale: 10
  hr_patch: 480

model:
  learning_rate: 5.0e-5
  lr_min: 1.0e-6
  ssim_weight: 0.0
  fft_weight: 0.0
  ref_drop_prob: 0.0

data:
  augment_ref: true
  ref_gray_prob: 0.2

train:
  max_epochs: 200
  val_check_interval: 0.1
  log_every_n_steps: 20
  early_stopping_patience: 30
  accumulate_grad_batches: 2
